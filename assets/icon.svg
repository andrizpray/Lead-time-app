<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- Clock circle -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#green)" stroke-width="14"/>

  <!-- Clock hands -->
  <!-- Hour hand pointing to ~10 o'clock -->
  <line x1="256" y1="240" x2="220" y2="160" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute hand pointing to ~2 o'clock -->
  <line x1="256" y1="240" x2="300" y2="200" stroke="white" stroke-width="7" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="240" r="12" fill="white"/>

  <!-- Paper / document icon at bottom -->
  <rect x="180" y="340" width="100" height="120" rx="8" fill="white" opacity="0.9"/>
  <!-- Lines on paper -->
  <rect x="196" y="360" width="68" height="8" rx="4" fill="#059669"/>
  <rect x="196" y="380" width="56" height="6" rx="3" fill="#94A3B8"/>
  <rect x="196" y="396" width="60" height="6" rx="3" fill="#94A3B8"/>
  <rect x="196" y="412" width="44" height="6" rx="3" fill="#94A3B8"/>

  <!-- Arrow going down (lead time tracking) -->
  <line x1="300" y1="370" x2="300" y2="430" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
  <polygon points="300,440 280,422 320,422" fill="#F59E0B"/>

  <!-- Tonase / weight icon hint -->
  <path d="M 340 370 L 380 370 L 360 340 Z" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linejoin="round"/>
</svg>
